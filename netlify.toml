[build]
  publish = "frontend"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.scan]
  timeout = 26

[functions.plan1]
  timeout = 26

[functions.call-arb]
  timeout = 26

[functions.put-arb]
  timeout = 26

[functions.margins]
  timeout = 20

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

